<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2b1612">
<title>Friendsgiving Potluck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a printed dinner invitation on walnut. Quiet centered masthead, then one framed portrait per household. */
:root{
  --ground:#2b1612; --surface:#39201a; --card:#42261d; --line:#6e4a36;
  --gold:#d0a65c; --gold-soft:#e3c388; --rust:#b0562b; --wine:#7d2a2c;
  --ivory:#f6ead6; --taupe:#d3bfa8; --alert:#f1b5a4;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ivory);font:400 16px/1.45 var(--body);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:980px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header{padding-block:44px 30px;text-align:center}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.ornament{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px auto 14px;max-width:260px;color:var(--gold)}
.ornament::before,.ornament::after{content:"";flex:1;height:1px;background:var(--line)}
.ornament svg{width:20px;height:20px;fill:currentColor}
h1{font:italic 500 clamp(50px,14vw,76px)/1 var(--display);margin:0;letter-spacing:-.01em}
.when{margin:0;font:500 clamp(21px,5.6vw,25px)/1.25 var(--display);font-variant-numeric:lining-nums;color:var(--ivory)}
.sub{margin:4px 0 0;color:var(--taupe);font-variant-numeric:tabular-nums}

/* Table so far */
.table-sum{border-block:1px solid var(--line);padding-block:16px;display:grid;gap:12px}
.table-sum h2{margin:0;text-align:center;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--taupe)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 4px}
.cat{padding:2px 4px;text-align:center;color:var(--taupe);min-width:0}
.cat b{display:block;font:500 25px/1.2 var(--body);opacity:.55;font-variant-numeric:tabular-nums}
.cat span{font-size:13px}
.cat.has{color:var(--ivory)}
.cat.has b{color:var(--gold-soft);opacity:1}
@media(min-width:620px){.cats{grid-template-columns:repeat(6,1fr)}}

.status{margin:14px 0 0;padding:10px 12px;border-radius:6px;background:var(--wine);color:var(--ivory);font-weight:500;display:flex;gap:10px;align-items:center;justify-content:space-between}
.status button{flex:none;border:0;background:var(--ivory);color:var(--wine);font-weight:700;border-radius:6px;padding:6px 12px}
.status.setup{background:var(--surface);color:var(--gold-soft);border:1px solid var(--line)}

/* Families */
.families{display:grid;gap:26px;grid-template-columns:1fr;margin-top:26px}
@media(min-width:720px){.families{grid-template-columns:repeat(2,1fr);align-items:start}}
.fam{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0}
.fam img{border-radius:3px;display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.fam-body{padding:14px 8px 8px;display:grid;gap:10px}
.fam-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fam h3{margin:0;font:600 29px/1.15 var(--display);min-width:0}
.party{flex:none;color:var(--gold-soft);font-size:14px}
.dishes{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.dish{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.dish>div{flex:1;min-width:0;overflow-wrap:anywhere}
.dish strong{font-weight:600;display:block}
.dish small{color:var(--taupe);font-size:14px;display:block}
.dish button{flex:none;min-height:40px;padding:0 10px;background:none;border:1px solid var(--line);border-radius:6px;color:var(--ivory);font-size:14px}
.none{margin:0;color:var(--taupe);padding:8px 0;border-top:1px solid var(--line)}
.add{min-height:48px;border:1px solid var(--gold);border-radius:6px;background:none;color:var(--gold-soft);font-weight:600}
.add:hover{background:var(--gold);color:var(--ground)}

/* Sheet */
dialog{border:0;padding:0;background:var(--surface);color:var(--ivory);width:min(520px,100%);max-width:100%;max-height:92dvh;margin:auto auto 0;border-radius:12px 12px 0 0;overflow:auto}
@media(min-width:620px){dialog{margin:auto;border-radius:10px}}
dialog::backdrop{background:rgba(18,8,5,.72)}
form{padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
form h2{margin:0;font:600 27px/1.2 var(--display)}
label,legend{font-weight:600;font-size:15px;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.field{display:grid;gap:6px}
input[type=text]{width:100%;min-height:48px;padding:10px 12px;font-size:16px;background:var(--ground);border:1px solid var(--line);border-radius:6px}
input[type=text]:focus{border-color:var(--gold)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips label{display:flex;align-items:center;justify-content:center;min-height:44px;border:1.5px solid var(--line);border-radius:6px;font-weight:500;cursor:pointer}
.chips input:checked+label{background:var(--gold);border-color:var(--gold);color:var(--ground);font-weight:700}
.chips input:focus-visible+label{outline:3px solid var(--gold);outline-offset:2px}
.already{margin:6px 0 0;font-size:14px;color:var(--taupe);overflow-wrap:anywhere}
.err{margin:0;color:var(--alert);font-weight:600}
.btns{display:flex;gap:10px}
.btns button{flex:1;min-height:48px;border-radius:6px;font-weight:700;border:1.5px solid var(--line);background:none}
.btns .save{background:var(--gold);border-color:var(--gold);color:var(--ground)}
.btns button:disabled{opacity:.6}
.remove{justify-self:center;background:none;border:0;color:var(--alert);font-weight:600;min-height:40px;padding:0 12px}
footer{margin-top:24px;text-align:center;color:var(--taupe);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
    <header>
    <p class="eyebrow">A potluck supper</p>
    <h1>Friendsgiving</h1>
    <div class="ornament" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2c1 3 2 4 4 4-1 1.500-1 2.500 0 3.500 1.500-.5 3-1.500 4-1.500-.5 2-.5 3 1 4-1.500 1-3.500 2.500-4 3 .5 1 .5 2 0 2.500-1.500-.5-3-.5-4.500 0V22h-1v-4.500c-1.500-.5-3-.5-4.500 0-.5-.5-.5-1.500 0-2.500-.5-.5-2.500-2-4-3 1.500-1 1.500-2 1-4 1 0 2.500 1 4 1.500 1-1 1-2 0-3.500 2 0 3-1 4-4z"/></svg></div>
    <p class="when">Friday, November 20 at 6:00 PM PST</p>
    <p class="sub"><span id="days"></span>16 guests</p>
  </header>

  <section class="table-sum" aria-label="What's covered so far">
    <h2>On the table so far</h2>
    <div class="cats" id="cats"></div>
  </section>
  <div id="status" aria-live="polite"></div>

  <main class="families" id="families"></main>
  <footer id="foot">Loading the list…</footer>
</div>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <form id="form" novalidate>
    <h2 id="sheetTitle"></h2>
    <div class="field">
      <label for="dish">What are you bringing?</label>
      <input type="text" id="dish" maxlength="80" autocomplete="off" enterkeyhint="done" placeholder="Dish or item">
    </div>
    <fieldset>
      <legend>Category</legend>
      <div class="chips" id="chips"></div>
      <p class="already" id="already" hidden></p>
    </fieldset>
    <div class="field">
      <label for="note">Note (optional)</label>
      <input type="text" id="note" maxlength="140" autocomplete="off" enterkeyhint="done" placeholder="Allergens, serving needs, oven space">
    </div>
    <p class="err" id="err" hidden></p>
    <div class="btns">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="save" id="save">Save</button>
    </div>
    <button type="button" class="remove" id="remove" hidden>Remove this item</button>
  </form>
</dialog>

const CATEGORIES = ["Mains","Sides","Starters","Desserts","Drinks","Supplies"];
const LIVE = /^https:\/\/script\.google\.com\//.test(API_URL);
const DEMO_KEY = "fg-demo";

const $ = id => document.getElementById(id);
let entries = [], loaded = false, failed = false, writeSeq = 0, current = null, confirming = false;

function el(tag, cls, text){const n=document.createElement(tag); if(cls)n.className=cls; if(text!=null)n.textContent=text; return n}

async function api(body){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), 25000);
  try{
    const res = await fetch(API_URL, body
      ? {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body), signal:ctl.signal}
      : {cache:"no-store", signal:ctl.signal});
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "failed");
    return data.entries;
  } finally { clearTimeout(t) }
}
function demoRead(){try{return JSON.parse(localStorage.getItem(DEMO_KEY))||[]}catch(e){return []}}
function demoWrite(body){
  let list = demoRead().filter(x=>x.id!==body.id);
  if(body.action==="save") list.push({id:body.id,family:body.family,dish:body.dish,category:body.category,note:body.note});
  try{localStorage.setItem(DEMO_KEY,JSON.stringify(list))}catch(e){}
  return list;
}

async function refresh(){
  if(!LIVE){entries=demoRead();loaded=true;render();return}
  const seq = writeSeq;
  try{
    const list = await api();
    if(seq!==writeSeq) return;   // a save finished meanwhile; its result is newer
    entries=list; loaded=true; failed=false;
  }catch(e){ failed=true }
  render();
}

function render(){
  // Days to go
  const today = new Date().toLocaleDateString("en-CA",{timeZone:"America/Los_Angeles"});
  const d = Math.round((Date.parse("2026-11-20") - Date.parse(today))/864e5);
  $("days").textContent = d<0 ? "" : d===0 ? "Today · " : d===1 ? "Tomorrow · " : d+" days to go · ";

  // Category tally
  const cats=$("cats"); cats.replaceChildren();
  CATEGORIES.forEach(c=>{
    const n=entries.filter(e=>e.category===c).length;
    const box=el("div","cat"+(n?" has":""));
    box.append(el("b",null,n),el("span",null,c));
    cats.append(box);
  });

  // Status
  const st=$("status"); st.replaceChildren();
  if(!LIVE){
    st.append(el("div","status setup","Setup isn't finished. Entries are only saved on this device."));
  }else if(failed){
    const box=el("div","status");
    box.append(el("span",null,loaded?"Couldn't refresh the list. It may be out of date.":"Couldn't load the list. Check your connection."));
    const b=el("button",null,"Try again"); b.type="button"; b.onclick=refresh; box.append(b);
    st.append(box);
  }

  // Families
  const root=$("families");
  const frag=document.createDocumentFragment();
  FAMILIES.forEach(f=>{
    const card=el("article","fam");
    const img=new Image(); img.src=f.img; img.alt=f.name; img.width=760; img.height=570; img.decoding="async";
    const body=el("div","fam-body");
    const head=el("div","fam-head");
    head.append(el("h3",null,f.name),el("span","party",f.size===1?"1 guest":f.size+" guests"));
    body.append(head);
    const mine=entries.filter(e=>e.family===f.id);
    if(mine.length){
      const ul=el("ul","dishes");
      mine.forEach(e=>{
        const li=el("li","dish"), txt=el("div");
        txt.append(el("strong",null,e.dish));
        txt.append(el("small",null,e.category+(e.note?" · "+e.note:"")));
        const b=el("button",null,"Edit"); b.type="button";
        b.setAttribute("aria-label","Edit "+e.dish);
        b.onclick=()=>openSheet(f,e);
        li.append(txt,b); ul.append(li);
      });
      body.append(ul);
    }else if(loaded){
      body.append(el("p","none","Nothing added yet"));
    }
    const add=el("button","add",mine.length?"Add another item":"Add what you're bringing");
    add.type="button"; add.onclick=()=>openSheet(f,null);
    body.append(add);
    card.append(img,body); frag.append(card);
  });
  root.replaceChildren(frag);

  $("foot").textContent = loaded ? "Tap Edit to change or remove an item. The list updates for everyone." : "Loading the list…";
}

function showAlready(){
  const c=document.querySelector('input[name=cat]:checked');
  const box=$("already");
  const others=c?entries.filter(e=>e.category===c.value&&(!current.entry||e.id!==current.entry.id)):[];
  box.hidden=!others.length;
  box.textContent=others.length?"Already coming: "+others.map(e=>e.dish).join(", "):"";
}

function openSheet(family,entry){
  current={family,entry}; confirming=false;
  $("sheetTitle").textContent=(entry?"Edit item for ":"Add item for ")+family.name;
  $("dish").value=entry?entry.dish:"";
  $("note").value=entry?(entry.note||""):"";
  document.querySelectorAll("input[name=cat]").forEach(r=>r.checked=entry?r.value===entry.category:false);
  $("err").hidden=true; setBusy(false);
  $("remove").hidden=!entry; $("remove").textContent="Remove this item";
  showAlready();
  $("sheet").showModal();
}
function closeSheet(){ $("sheet").close(); current=null }
function setBusy(on,label){
  $("save").disabled=on; $("remove").disabled=on;
  $("save").textContent=on&&label||"Save";
}
function showErr(m){$("err").textContent=m;$("err").hidden=false}

async function commit(body,label,failMsg){
  setBusy(true,label); $("err").hidden=true;
  const seq=++writeSeq;
  try{
    const list=LIVE?await api(body):demoWrite(body);
    if(seq===writeSeq){entries=list;loaded=true;failed=false}
    closeSheet(); render();
  }catch(e){
    setBusy(false);
    showErr(e.message&&e.message!=="failed"&&!/abort|fetch|network|json/i.test(e.message)?e.message:failMsg);
  }
}

CATEGORIES.forEach((c,i)=>{
  const r=el("input"); r.type="radio"; r.name="cat"; r.id="cat"+i; r.value=c;
  r.onchange=showAlready;
  const l=el("label",null,c); l.htmlFor=r.id;
  $("chips").append(r,l);
});

$("form").addEventListener("submit",ev=>{
  ev.preventDefault();
  const dish=$("dish").value.trim();
  const c=document.querySelector("input[name=cat]:checked");
  if(!dish){showErr("Enter what you're bringing.");$("dish").focus();return}
  if(!c){showErr("Pick a category.");return}
  const id=current.entry?current.entry.id:(Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8));
  commit({action:"save",id,family:current.family.id,dish,category:c.value,note:$("note").value.trim()},
    "Saving…","Couldn't save. Check your connection and tap Save again.");
});
$("cancel").onclick=closeSheet;
$("remove").onclick=()=>{
  if(!confirming){confirming=true;$("remove").textContent="Tap again to remove";return}
  commit({action:"delete",id:current.entry.id},"Removing…","Couldn't remove it. Try again.");
};

render(); refresh();
setInterval(()=>{if(!document.hidden)refresh()},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
</script>
</body>
</html>
